<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#07070b" />
    <meta name="description" content="Ignite — keep the living flame alight and improve your personal best." />
    <link rel="stylesheet" href="./src/styles.css" />
    <title>Ignite</title>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <script>
      window.__INFERNO_PLATFORM_TARGET__ = 'web';
      window.__YANDEX_BOOTSTRAP_STARTED_AT__ = Date.now();
      window.__YANDEX_SDK_READY__ = (function () {
        if (window.__INFERNO_PLATFORM_TARGET__ !== 'yandex') return Promise.resolve(false);
        if (window.YaGames) return Promise.resolve(true);
        return new Promise(function (resolve) {
          var settled = false;
          var timeout;
          function finish(ready) {
            if (settled) return;
            settled = true;
            clearTimeout(timeout);
            resolve(ready);
          }
          var sdk = document.createElement('script');
          sdk.src = '/sdk.js';
          sdk.onload = function () { finish(Boolean(window.YaGames)); };
          sdk.onerror = function () { finish(false); };
          timeout = setTimeout(function () { finish(false); }, 4500);
          document.head.appendChild(sdk);
        });
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
